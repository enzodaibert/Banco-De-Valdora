<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de Valdora | Autenticação</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #0b0d0f;
        --night2: #111417;
        --night3: #181c20;
        --night4: #1f2428;
        --night5: #282e34;
        --gold: #c8993a;
        --gold2: #e0b55a;
        --gold3: #f5d080;
        --gold-dim: rgba(200, 153, 58, 0.15);
        --gold-line: rgba(200, 153, 58, 0.25);
        --emerald: #1a6b4a;
        --emerald2: #22a06b;
        --crimson: #8b1a24;
        --crimson2: #c0392b;
        --text: #e8e4dc;
        --text2: #9a9285;
        --text3: #5a5248;
        --border: rgba(232, 228, 220, 0.07);
        --border2: rgba(232, 228, 220, 0.04);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --shadow2: 0 16px 60px rgba(0, 0, 0, 0.6);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Syne", sans-serif;
        background: var(--night);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }

      #screen-login {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .login-box {
        background: var(--night2);
        border: 1px solid var(--gold-line);
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: var(--shadow2);
        border-radius: 4px;
      }
      .login-logo {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-logo h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 2.5rem;
        font-weight: 300;
      }
      .login-logo em {
        color: var(--gold2);
        font-style: italic;
      }

      .fg {
        margin-bottom: 1.5rem;
      }
      .fg label {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text3);
        margin-bottom: 0.5rem;
      }
      .fg input,
      .fg select {
        width: 100%;
        background: var(--night3);
        border: 1px solid var(--border);
        padding: 0.8rem;
        color: var(--text);
        border-radius: 2px;
        outline: none;
        transition: 0.3s;
      }
      .fg input:focus {
        border-color: var(--gold);
      }

      .btn-gold {
        width: 100%;
        background: var(--gold);
        color: var(--night);
        border: none;
        padding: 1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-gold:hover {
        background: var(--gold2);
        box-shadow: 0 0 20px rgba(200, 153, 58, 0.3);
      }
      .btn-text {
        background: none;
        border: none;
        color: var(--text3);
        width: 100%;
        margin-top: 1rem;
        cursor: pointer;
        font-size: 0.8rem;
      }

      #screen-app {
        display: none;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        height: 60px;
        background: var(--night2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .topbar-nav {
        display: flex;
        gap: 1rem;
        margin-left: 2rem;
      }
      .tb-btn {
        background: none;
        border: none;
        color: var(--text3);
        cursor: pointer;
        font-family: "Syne";
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .tb-btn.active {
        color: var(--gold);
      }

      .main-content {
        max-width: 1000px;
        margin: 2rem auto;
        width: 100%;
        padding: 0 1rem;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
      }

      .card {
        background: var(--night2);
        border: 1px solid var(--border);
        padding: 2rem;
        border-radius: 4px;
        margin-bottom: 1.5rem;
      }
      .balance-huge {
        font-family: "Cormorant Garamond";
        font-size: 3.5rem;
        color: var(--gold);
        margin: 1rem 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th {
        text-align: left;
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--text3);
        padding: 1rem;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 1rem;
        border-bottom: 1px solid var(--border2);
        font-size: 0.9rem;
      }
      .tx-credit {
        color: var(--emerald2);
      }
      .tx-debit {
        color: var(--crimson2);
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal.open {
        display: flex;
      }
      .modal-content {
        background: var(--night2);
        border: 1px solid var(--gold);
        padding: 2.5rem;
        width: 100%;
        max-width: 400px;
      }
      .admin-action-btn {
        padding: 0.3rem 0.6rem;
        font-size: 0.7rem;
        cursor: pointer;
        border: 1px solid var(--gold);
        background: none;
        color: var(--gold);
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div id="screen-login">
      <div class="login-box">
        <div class="login-logo">
          <h1>Banco de <em>Valdora</em></h1>
          <p
            style="
              font-size: 0.7rem;
              color: var(--text3);
              letter-spacing: 0.2em;
              margin-top: 0.5rem;
            "
          >
            ACESSO AO COFRE
          </p>
        </div>
        <div class="fg">
          <label>Usuário</label>
          <input type="text" id="login-user" placeholder="Nome do titular" />
        </div>
        <div class="fg">
          <label>Senha</label>
          <input type="password" id="login-pass" placeholder="••••••••" />
        </div>
        <button class="btn-gold" onclick="handleLogin()">
          Entrar no Sistema
        </button>
        <button class="btn-text" onclick="openModal('modal-register')">
          Solicitar Abertura de Conta
        </button>
      </div>
    </div>

    <div id="screen-app">
      <div class="topbar">
        <div
          style="font-family: &quot;Cormorant Garamond&quot;; font-size: 1.2rem"
        >
          Valdora<em>Bank</em>
        </div>
        <nav class="topbar-nav">
          <button class="tb-btn active" onclick="goPage('dash', this)">
            Cofre
          </button>
          <button class="tb-btn" onclick="goPage('pix', this)">
            Transferir
          </button>
          <button
            class="tb-btn"
            id="nav-admin"
            style="display: none"
            onclick="goPage('admin', this)"
          >
            Conselho Admin
          </button>
        </nav>
        <div
          style="
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
          "
        >
          <span
            id="display-pix-key"
            style="
              font-size: 0.7rem;
              color: var(--gold2);
              border: 1px solid var(--gold-line);
              padding: 2px 8px;
            "
            >CHAVE: ---</span
          >
          <button class="tb-btn" onclick="logout()">Sair</button>
        </div>
      </div>

      <div class="main-content">
        <div id="page-dash" class="page active">
          <div class="card">
            <p
              style="
                text-transform: uppercase;
                font-size: 0.7rem;
                color: var(--text3);
              "
            >
              Saldo disponível
            </p>
            <div class="balance-huge" id="balance-value">V$ 0,00</div>
            <p id="account-owner" style="color: var(--text2)"></p>
          </div>
          <h3>Últimas Movimentações</h3>
          <div class="card" style="padding: 0">
            <table>
              <thead>
                <tr>
                  <th>Destino/Origem</th>
                  <th>Data</th>
                  <th>Valor</th>
                </tr>
              </thead>
              <tbody id="tx-history"></tbody>
            </table>
          </div>
        </div>

        <div id="page-pix" class="page">
          <div class="card" style="max-width: 500px; margin: auto">
            <h2
              style="
                font-family: &quot;Cormorant Garamond&quot;;
                margin-bottom: 1.5rem;
              "
            >
              Transferência Instantânea
            </h2>
            <div class="fg">
              <label>Chave PIX do Destinatário</label>
              <input
                type="text"
                id="pix-target-key"
                placeholder="Digite a chave..."
              />
            </div>
            <div class="fg">
              <label>Valor em Valdorins (V$)</label>
              <input type="number" id="pix-amount" placeholder="0.00" />
            </div>
            <button class="btn-gold" onclick="sendPix()">
              Realizar Transferência
            </button>
          </div>
        </div>

        <div id="page-admin" class="page">
          <h2>Gestão do Tesouro</h2>
          <div class="card" style="padding: 0; margin-top: 1.5rem">
            <table>
              <thead>
                <tr>
                  <th>Usuário</th>
                  <th>Chave Pix</th>
                  <th>Saldo</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="admin-user-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="modal-register">
      <div class="modal-content">
        <h3 style="margin-bottom: 1.5rem">Nova Credencial</h3>
        <div class="fg">
          <label>Nome de Usuário</label><input type="text" id="reg-user" />
        </div>
        <div class="fg">
          <label>Chave PIX Desejada</label
          ><input
            type="text"
            id="reg-pix"
            placeholder="ex: imperador@valdora"
          />
        </div>
        <div class="fg">
          <label>Senha</label><input type="password" id="reg-pass" />
        </div>
        <button class="btn-gold" onclick="register()">Criar Conta</button>
        <button class="btn-text" onclick="closeModal('modal-register')">
          Cancelar
        </button>
      </div>
    </div>

    <div class="modal" id="modal-admin-edit">
      <div class="modal-content">
        <h3 id="admin-edit-title">Ajustar Saldo</h3>
        <p
          id="admin-edit-name"
          style="font-size: 0.8rem; margin: 10px 0; color: var(--gold)"
        ></p>
        <div class="fg">
          <label>Valor (use "-" para retirar)</label>
          <input type="number" id="admin-edit-amount" />
        </div>
        <button class="btn-gold" onclick="executeAdminAction()">
          Confirmar Ajuste
        </button>
        <button class="btn-text" onclick="closeModal('modal-admin-edit')">
          Voltar
        </button>
      </div>
    </div>

    <script>
      // BANCO DE DADOS INICIAL
      let users = JSON.parse(localStorage.getItem("valdora_v2")) || [
        {
          id: 1,
          user: "Admin",
          pass: "ADMIN",
          pix: "admin@valdora",
          balance: 999999999,
          isAdmin: true,
          tx: [],
        },
        {
          id: 2,
          user: "Cedric",
          pass: "123",
          pix: "cedric@valdora",
          balance: 1200,
          isAdmin: false,
          tx: [],
        },
      ];

      let currentUser = null;
      let selectedUserIdForAdmin = null;

      function save() {
        localStorage.setItem("valdora_v2", JSON.stringify(users));
      }

      function handleLogin() {
        const uName = document.getElementById("login-user").value;
        const uPass = document.getElementById("login-pass").value;
        const user = users.find(
          (u) =>
            u.user.toLowerCase() === uName.toLowerCase() && u.pass === uPass,
        );

        if (user) {
          currentUser = user;
          showApp();
        } else {
          alert("Credenciais não encontradas no Registro.");
        }
      }

      function register() {
        const user = document.getElementById("reg-user").value;
        const pix = document.getElementById("reg-pix").value;
        const pass = document.getElementById("reg-pass").value;

        if (!user || !pix || !pass) return alert("Preencha todos os campos.");
        if (users.find((u) => u.pix === pix))
          return alert("Esta Chave Pix já existe.");

        users.push({
          id: Date.now(),
          user,
          pass,
          pix,
          balance: 1000,
          isAdmin: false,
          tx: [
            {
              party: "Banco de Valdora",
              amount: 1000,
              type: "credit",
              date: new Date().toLocaleDateString(),
            },
          ],
        });
        save();
        alert("Conta aberta com sucesso! Faça login.");
        closeModal("modal-register");
      }

      function showApp() {
        document.getElementById("screen-login").style.display = "none";
        document.getElementById("screen-app").style.display = "flex";
        document.getElementById("nav-admin").style.display = currentUser.isAdmin
          ? "block"
          : "none";
        document.getElementById("display-pix-key").innerText =
          `CHAVE: ${currentUser.pix}`;
        updateUI();
      }

      function logout() {
        location.reload();
      }

      function goPage(pageId, btn) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelectorAll(".tb-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("page-" + pageId).classList.add("active");
        btn.classList.add("active");
        if (pageId === "admin") renderAdmin();
      }

      function updateUI() {
        const balEl = document.getElementById("balance-value");
        if (currentUser.isAdmin) {
          balEl.innerHTML = "V$ &infin;";
        } else {
          balEl.innerText = `V$ ${currentUser.balance.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}`;
        }
        document.getElementById("account-owner").innerText =
          `Titular: ${currentUser.user}`;
        const hist = document.getElementById("tx-history");
        hist.innerHTML = "";
        currentUser.tx
          .slice()
          .reverse()
          .forEach((t) => {
            hist.innerHTML += `<tr>
                    <td>${t.party}</td>
                    <td style="font-size:0.7rem; color:var(--text3)">${t.date}</td>
                    <td class="tx-${t.type}">${t.type === "credit" ? "+" : "-"} V$ ${t.amount.toLocaleString("pt-BR")}</td>
                </tr>`;
          });
      }

      function sendPix() {
        const key = document.getElementById("pix-target-key").value;
        const amount = parseFloat(document.getElementById("pix-amount").value);
        const target = users.find((u) => u.pix === key);

        if (!target) return alert("Chave Pix não encontrada.");
        if (isNaN(amount) || amount <= 0) return alert("Valor inválido.");
        if (!currentUser.isAdmin && amount > currentUser.balance)
          return alert("Saldo insuficiente.");
        if (target.pix === currentUser.pix)
          return alert("Você não pode mandar para si mesmo.");

        if (!currentUser.isAdmin) currentUser.balance -= amount;
        target.balance += amount;

        const date = new Date().toLocaleDateString();
        currentUser.tx.push({
          party: target.user,
          amount,
          type: "debit",
          date,
        });
        target.tx.push({
          party: currentUser.user,
          amount,
          type: "credit",
          date,
        });

        save();
        updateUI();
        alert("Transferência concluída!");
        document.getElementById("pix-amount").value = "";
      }

      function renderAdmin() {
        const list = document.getElementById("admin-user-list");
        list.innerHTML = "";
        users.forEach((u) => {
          list.innerHTML += `<tr>
                    <td>${u.user} ${u.isAdmin ? "👑" : ""}</td>
                    <td>${u.pix}</td>
                    <td>V$ ${u.balance.toLocaleString()}</td>
                    <td>
                        <button class="admin-action-btn" onclick="openAdminEdit(${u.id})">Ajustar Saldo</button>
                        <button class="admin-action-btn" style="border-color:red; color:red" onclick="banUser(${u.id})">Banir</button>
                    </td>
                </tr>`;
        });
      }

      function openAdminEdit(id) {
        selectedUserIdForAdmin = id;
        const user = users.find((u) => u.id === id);
        document.getElementById("admin-edit-name").innerText =
          `Editando: ${user.user}`;
        openModal("modal-admin-edit");
      }

      function executeAdminAction() {
        const amount = parseFloat(
          document.getElementById("admin-edit-amount").value,
        );
        const user = users.find((u) => u.id === selectedUserIdForAdmin);
        if (isNaN(amount)) return alert("Insira um valor.");
        user.balance += amount;
        user.tx.push({
          party: "AJUSTE",
          amount: Math.abs(amount),
          type: amount > 0 ? "credit" : "debit",
          date: new Date().toLocaleDateString(),
        });
        save();
        renderAdmin();
        closeModal("modal-admin-edit");
        if (user.id === currentUser.id) updateUI();
      }

      function banUser(id) {
        if (!confirm("Deseja realmente exilar este usuário?")) return;
        users = users.filter((u) => u.id !== id);
        save();
        renderAdmin();
      }

      function openModal(id) {
        document.getElementById(id).classList.add("open");
      }
      function closeModal(id) {
        document.getElementById(id).classList.remove("open");
      }
    </script>
  </body>
</html>
