<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de Valdora</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #0b0d0f;
        --night2: #111417;
        --night3: #181c20;
        --night4: #1f2428;
        --night5: #282e34;
        --gold: #c8993a;
        --gold2: #e0b55a;
        --gold3: #f5d080;
        --gold-dim: rgba(200, 153, 58, 0.12);
        --gold-line: rgba(200, 153, 58, 0.22);
        --emerald2: #22a06b;
        --red: #e05555;
        --text: #e8e4dc;
        --text2: #9a9285;
        --text3: #5a5248;
        --border: rgba(232, 228, 220, 0.07);
        --border2: rgba(232, 228, 220, 0.04);
        --shadow2: 0 16px 60px rgba(0, 0, 0, 0.6);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Syne", sans-serif;
        background: var(--night);
        color: var(--text);
        min-height: 100vh;
        font-size: 14px;
        overflow-x: hidden;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* LOGIN */
      #screen-login {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .login-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        max-width: 880px;
        width: 100%;
        min-height: 560px;
        border: 1px solid var(--gold-line);
        border-radius: 2px;
        overflow: hidden;
        box-shadow: var(--shadow2);
      }
      .login-left {
        background: linear-gradient(
          160deg,
          var(--night3) 0%,
          var(--night2) 100%
        );
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .bank-wordmark {
        font-family: "Cormorant Garamond", serif;
        font-size: 2.4rem;
        font-weight: 300;
        color: var(--text);
        letter-spacing: 0.03em;
        line-height: 1.1;
      }
      .bank-wordmark em {
        color: var(--gold2);
        font-style: italic;
      }
      .login-right {
        background: var(--night2);
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.5rem;
      }
      .login-heading {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.6rem;
        font-weight: 400;
      }
      .login-heading span {
        color: var(--gold2);
      }

      /* INPUTS */
      .fg {
        margin-bottom: 1.25rem;
      }
      .fg label {
        display: block;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text3);
        margin-bottom: 0.45rem;
      }
      .fg input {
        width: 100%;
        background: var(--night3);
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text);
        font-family: "Syne", sans-serif;
        font-size: 0.85rem;
        padding: 0.7rem 0.9rem;
        transition: 0.15s;
        outline: none;
      }
      .fg input:focus {
        border-color: var(--gold-line);
        background: var(--night4);
      }

      .btn-main {
        width: 100%;
        background: var(--gold);
        border: none;
        border-radius: 2px;
        color: var(--night);
        font-family: "Syne", sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.9rem;
        cursor: pointer;
        transition: 0.18s;
      }
      .btn-main:hover {
        background: var(--gold2);
        box-shadow: 0 6px 20px rgba(200, 153, 58, 0.3);
      }

      /* APP STYLES */
      #screen-app {
        display: none;
        min-height: 100vh;
        flex-direction: column;
      }
      .topbar {
        height: 54px;
        background: var(--night2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 1.75rem;
        gap: 1.25rem;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .tb-btn {
        background: transparent;
        border: none;
        color: var(--text3);
        font-family: "Syne", sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.4rem 0.85rem;
        border-radius: 2px;
        cursor: pointer;
      }
      .tb-btn.active {
        color: var(--gold2);
        background: var(--gold-dim);
      }
      .topbar-user {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .app-main {
        flex: 1;
        max-width: 1020px;
        margin: 0 auto;
        padding: 2rem 1.75rem;
        width: 100%;
      }
      .page {
        display: none;
        animation: fadeIn 0.2s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* DASHBOARD CARDS */
      .dash-hero {
        background: var(--night2);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 2.5rem;
        margin-bottom: 1.25rem;
        position: relative;
        overflow: hidden;
      }
      .balance-amount {
        font-family: "Cormorant Garamond", serif;
        font-size: 3.2rem;
        font-weight: 300;
        color: var(--text);
      }
      .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .stat-card {
        background: var(--night2);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 1.25rem 1.5rem;
      }
      .tx-container {
        background: var(--night2);
        border: 1px solid var(--border);
        border-radius: 2px;
        overflow: hidden;
      }
      .tx-row {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 0.85rem;
        align-items: center;
        padding: 0.9rem 1.25rem;
        border-bottom: 1px solid var(--border2);
      }

      /* PROFILE */
      .profile-layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 1.25rem;
      }
      .profile-card {
        background: var(--night2);
        border: 1px solid var(--border);
        border-radius: 2px;
        overflow: hidden;
      }
      .profile-banner {
        height: 70px;
        background: linear-gradient(135deg, var(--night3), var(--night4));
      }
      .profile-big-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--night5);
        border: 2px solid var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        color: var(--gold2);
        margin: -28px auto 10px;
        font-weight: bold;
      }

      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal-box {
        background: var(--night2);
        border: 1px solid var(--border);
        padding: 2.5rem;
        max-width: 420px;
        width: 100%;
        position: relative;
      }
      .toast {
        position: fixed;
        bottom: 1.75rem;
        right: 1.75rem;
        background: var(--night3);
        border-left: 3px solid var(--gold);
        color: var(--text);
        padding: 0.85rem 1.25rem;
        font-size: 0.8rem;
        z-index: 300;
        box-shadow: var(--shadow2);
      }
    </style>
  </head>
  <body>
    <div id="screen-login">
      <div class="login-wrap">
        <div class="login-left">
          <div class="bank-wordmark">Banco de<br /><em>Valdora</em></div>
          <div
            style="
              font-size: 0.7rem;
              color: var(--text3);
              letter-spacing: 0.2em;
              text-transform: uppercase;
            "
          >
            Acesso Cidadão
          </div>
        </div>
        <div class="login-right">
          <div class="login-heading">Acesse sua <span>conta</span></div>
          <div class="fg">
            <label>Usuário</label
            ><input type="text" id="l-user" placeholder="Nome de usuário" />
          </div>
          <div class="fg">
            <label>Senha / PIN</label
            ><input type="password" id="l-pass" placeholder="••••••••" />
          </div>
          <button class="btn-main" onclick="doLogin()">Entrar</button>
          <button
            onclick="openModal('modal-new-user')"
            style="
              background: none;
              border: none;
              color: var(--gold);
              font-size: 0.75rem;
              cursor: pointer;
              text-decoration: underline;
            "
          >
            Criar nova conta
          </button>
        </div>
      </div>
    </div>

    <div id="screen-app">
      <div class="topbar">
        <div class="topbar-logo">Banco de <em>Valdora</em></div>
        <nav class="topbar-nav">
          <button class="tb-btn active" onclick="goPage('dashboard', this)">
            Início
          </button>
          <button class="tb-btn" onclick="goPage('pix', this)">Pix</button>
          <button class="tb-btn" onclick="goPage('profile', this)">
            Minha Conta
          </button>
        </nav>
        <div class="topbar-user">
          <span id="tb-username" style="font-weight: bold"></span>
          <button
            onclick="location.reload()"
            style="
              background: none;
              border: 1px solid var(--border);
              color: var(--text3);
              padding: 4px 8px;
              cursor: pointer;
            "
          >
            Sair
          </button>
        </div>
      </div>

      <div class="app-main">
        <div id="page-dashboard" class="page active">
          <div class="dash-hero">
            <div class="hero-user-name" id="dash-welcome">Bem-vindo</div>
            <div style="margin-top: 20px">
              <div
                style="
                  font-size: 0.7rem;
                  color: var(--text3);
                  text-transform: uppercase;
                "
              >
                Saldo em conta
              </div>
              <div class="balance-amount">
                <span style="color: var(--gold2); font-size: 1.5rem">V$</span>
                <span id="dash-bal">0,00</span>
              </div>
            </div>
          </div>
          <div class="tx-container" id="tx-list"></div>
        </div>

        <div id="page-pix" class="page">
          <div
            style="
              background: var(--night2);
              padding: 2rem;
              border: 1px solid var(--border);
            "
          >
            <h2 class="login-heading" style="margin-bottom: 20px">
              Transferência <span>Pix</span>
            </h2>
            <div class="fg">
              <label>Chave Pix Destino</label
              ><input type="text" id="px-key" placeholder="usuario@valdora" />
            </div>
            <div class="fg">
              <label>Valor (V$)</label><input type="number" id="px-val" />
            </div>
            <button class="btn-main" onclick="sendPix()">Enviar Agora</button>
          </div>
        </div>

        <div id="page-profile" class="page">
          <div class="profile-layout">
            <div class="profile-card">
              <div class="profile-banner"></div>
              <div class="profile-big-avatar" id="p-avatar">?</div>
              <div style="padding: 15px; text-align: center">
                <div
                  id="p-name"
                  style="font-weight: bold; font-size: 1.2rem"
                ></div>
                <div
                  id="p-pix"
                  style="color: var(--gold2); font-size: 0.8rem"
                ></div>
              </div>
            </div>
            <div
              style="
                background: var(--night2);
                padding: 2rem;
                border: 1px solid var(--border);
              "
            >
              <h3 style="margin-bottom: 15px">Dados da Empresa</h3>
              <div class="fg">
                <label>Empresa</label><input type="text" id="p-edit-co" />
              </div>
              <div class="fg">
                <label>Cargo</label><input type="text" id="p-edit-role" />
              </div>
              <button class="btn-main" onclick="saveProfile()">
                Salvar Alterações
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-bg" id="modal-new-user">
      <div class="modal-box">
        <h3>Nova Conta</h3>
        <div class="fg">
          <label>Usuário</label><input type="text" id="nu-u" />
        </div>
        <div class="fg">
          <label>Chave Pix</label><input type="text" id="nu-p" />
        </div>
        <div class="fg">
          <label>Senha / PIN</label><input type="password" id="nu-s" />
        </div>
        <button class="btn-main" onclick="register()">Registrar</button>
        <button
          onclick="closeModal('modal-new-user')"
          style="
            margin-top: 10px;
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
          "
        >
          Voltar
        </button>
      </div>
    </div>

    <script>
      const DB_KEY = "VALDORA_DB";
      let user = null;

      function getDB() {
        return (
          JSON.parse(localStorage.getItem(DB_KEY)) || {
            users: [
              {
                id: 1,
                user: "Admin",
                pass: "ADMIN",
                pix: "admin@valdora",
                balance: 999999999,
                isAdmin: true,
                tx: [],
                company: "",
                role: "",
              },
            ],
          }
        );
      }
      function saveDB(db) {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      }

      function doLogin() {
        const db = getDB();
        const u = document.getElementById("l-user").value;
        const p = document.getElementById("l-pass").value;
        const found = db.users.find(
          (x) => x.user.toLowerCase() === u.toLowerCase() && x.pass === p,
        );
        if (found) {
          user = found;
          showApp();
        } else {
          alert("Dados incorretos");
        }
      }

      function showApp() {
        document.getElementById("screen-login").style.display = "none";
        document.getElementById("screen-app").style.display = "flex";
        updateUI();
      }

      function updateUI() {
        document.getElementById("tb-username").textContent = user.user;
        document.getElementById("dash-welcome").textContent =
          "Bom dia, " + user.user;
        document.getElementById("dash-bal").textContent =
          user.balance.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
        document.getElementById("p-avatar").textContent = user.user
          .substring(0, 2)
          .toUpperCase();
        document.getElementById("p-name").textContent = user.user;
        document.getElementById("p-pix").textContent = user.pix;
        document.getElementById("p-edit-co").value = user.company || "";
        document.getElementById("p-edit-role").value = user.role || "";
        renderTxs();
      }

      function renderTxs() {
        const list = document.getElementById("tx-list");
        list.innerHTML = user.tx.length
          ? ""
          : '<div style="padding:20px; color:var(--text3)">Sem transações.</div>';
        user.tx
          .slice()
          .reverse()
          .forEach((t) => {
            list.innerHTML += `<div class="tx-row">
                <div style="color:var(--gold)">✦</div>
                <div><div style="font-weight:bold">${t.party}</div><div style="font-size:0.7rem; color:var(--text3)">${t.date}</div></div>
                <div style="color:${t.type === "credit" ? "#22a06b" : "#e05555"}">${t.type === "credit" ? "+" : "-"} V$ ${t.amount.toLocaleString()}</div>
            </div>`;
          });
      }

      function sendPix() {
        const k = document.getElementById("px-key").value;
        const v = parseFloat(document.getElementById("px-val").value);
        const db = getDB();
        const target = db.users.find((x) => x.pix === k);
        if (!target) return alert("Pix não encontrado");
        if (v > user.balance) return alert("Saldo insuficiente");

        const me = db.users.find((x) => x.id === user.id);
        const date = new Date().toLocaleDateString();
        me.balance -= v;
        target.balance += v;
        me.tx.push({
          party: target.user,
          amount: v,
          type: "debit",
          date: date,
        });
        target.tx.push({
          party: me.user,
          amount: v,
          type: "credit",
          date: date,
        });
        saveDB(db);
        user = me;
        updateUI();
        alert("Sucesso!");
      }

      function saveProfile() {
        const db = getDB();
        const me = db.users.find((x) => x.id === user.id);
        me.company = document.getElementById("p-edit-co").value;
        me.role = document.getElementById("p-edit-role").value;
        saveDB(db);
        user = me;
        updateUI();
        alert("Salvo!");
      }

      function register() {
        const db = getDB();
        db.users.push({
          id: Date.now(),
          user: document.getElementById("nu-u").value,
          pix: document.getElementById("nu-p").value,
          pass: document.getElementById("nu-s").value,
          balance: 50000,
          isAdmin: false,
          tx: [],
          company: "",
          role: "",
        });
        saveDB(db);
        closeModal("modal-new-user");
        alert("Registrado!");
      }

      function goPage(p, b) {
        document
          .querySelectorAll(".page")
          .forEach((x) => x.classList.remove("active"));
        document.getElementById("page-" + p).classList.add("active");
        document
          .querySelectorAll(".tb-btn")
          .forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
      }
      function openModal(id) {
        document.getElementById(id).style.display = "flex";
      }
      function closeModal(id) {
        document.getElementById(id).style.display = "none";
      }
    </script>
  </body>
</html>
